name: Bug report
description: Something in this tool behaves wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach game assets, account identifiers, library exports or saves. A security problem goes through GitHub's private vulnerability reporting, not this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and its output (redact personal paths).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release version or the commit you run from.
  - type: input
    id: environment
    attributes:
      label: Mac model and macOS version
    validations:
      required: true
